<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>城乡基建 MVP</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="is-setup">
  <header class="topbar">
    <div>
      <h1>城乡基建</h1>
      <p>本地最小可行版本 · 严格等概率最短路径 DP</p>
    </div>
    <button id="newGameTopBtn" class="ghost">重新开局</button>
  </header>

  <main class="layout">
    <section class="board-panel">
      <div id="setupPanel" class="card setup-card">
        <h2>城乡基建</h2>
        <p class="setup-intro">请选择本地多人轮流模式。每局都会自动生成新的地图与随机流程。</p>
        <h3 class="setup-subtitle">本地多人轮流游玩</h3>
        <label>玩家人数
          <select id="playerCountInput">
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人</option>
          </select>
        </label>
        <div id="playerNameInputs"></div>
        <button id="createGameBtn" class="primary setup-start">开始本地新游戏</button>
      </div>

      <div class="card board-card">
        <div class="board-title">
          <h2>地图</h2>
          <div id="phaseBadge" class="badge">未开始</div>
        </div>
        <svg id="gameBoard" viewBox="-130 0 1060 620" role="img" aria-label="城乡基建地图"></svg>
        <p class="hint" id="boardHint">创建游戏后开始。</p>
      </div>
    </section>

    <aside class="side-panel">
      <section class="card">
        <h2>当前状态</h2>
        <div id="statusPanel"></div>
      </section>

      <section class="card">
        <h2>操作</h2>
        <div id="actionPanel"></div>
      </section>

      <section class="card">
        <h2>玩家</h2>
        <div id="playersPanel"></div>
      </section>

      <section class="card log-card">
        <h2>日志</h2>
        <div id="logPanel"></div>
      </section>
    </aside>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
